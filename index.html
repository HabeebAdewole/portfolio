<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Adewole Habeeb Adebola — Software Engineer</title>
    <meta
      name="description"
      content="Software engineer. React and TypeScript on the front, Python and FastAPI behind it, and a year spent training models to catch fraud. Things I built, and how they went."
    />
    <meta name="author" content="Adewole Habeeb Adebola" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <!-- The headline is the first thing painted and it is set in Crete Round, so
         the latin subset is fetched in parallel with the CSS rather than after it.
         latin-ext is deliberately NOT preloaded — most visits never need it. -->
    <link
      rel="preload"
      href="/fonts/creteround-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/alegreyasans-400-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="canonical" href="https://adebola.me/" />
    <meta name="theme-color" content="#e6e8e3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph: what shows when the link is pasted into a message,
         an application, or LinkedIn. og:image and og:url must be ABSOLUTE —
         most scrapers will not resolve a relative one.

         The domain is hardcoded in exactly four places: the canonical link
         above, og:url, og:image and twitter:image. Moving to a real domain
         is a find-and-replace on https://adebola.me. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://adebola.me/" />
    <meta property="og:site_name" content="Adewole Habeeb Adebola" />
    <meta property="og:title" content="Adewole Habeeb Adebola — Software Engineer" />
    <meta
      property="og:description"
      content="React and TypeScript on the front, Python and FastAPI behind it, and a year spent training models to catch fraud."
    />
    <meta property="og:image" content="https://adebola.me/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A dark card reading 'Things I built, and how they went' over a strip of figures: 6 projects shipped, 2 running live, best F1 0.807, building since 2023."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@_debola7" />
    <meta name="twitter:title" content="Adewole Habeeb Adebola — Software Engineer" />
    <meta
      name="twitter:description"
      content="React and TypeScript on the front, Python and FastAPI behind it, and a year spent training models to catch fraud."
    />
    <meta name="twitter:image" content="https://adebola.me/og.png" />

    <!-- Set the theme before first paint so there is no flash of the wrong ground. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {
          /* private mode — fall through to prefers-color-scheme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
