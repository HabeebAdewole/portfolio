<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Adewole Habeeb Adebola — Software Engineer</title>
    <meta
      name="description"
      content="Software engineer. React and TypeScript on the front, Python and FastAPI behind it, and a year spent training models to catch fraud. Things I built, and how they went."
    />
    <meta name="author" content="Adewole Habeeb Adebola" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#e6e8e3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121412" media="(prefers-color-scheme: dark)" />

    <!-- Open Graph: what shows when the link is pasted into a message,
         an application, or LinkedIn. og:image must be an ABSOLUTE url —
         most scrapers will not resolve a relative one. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Adewole Habeeb Adebola" />
    <meta property="og:title" content="Adewole Habeeb Adebola — Software Engineer" />
    <meta
      property="og:description"
      content="React and TypeScript on the front, Python and FastAPI behind it, and a year spent training models to catch fraud."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="A dark card reading 'Things I built, and how they went' over a strip of figures: 6 projects shipped, 2 running live, best F1 0.807, building since 2023."
    />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:creator" content="@_debola7" />
    <meta name="twitter:title" content="Adewole Habeeb Adebola — Software Engineer" />
    <meta
      name="twitter:description"
      content="React and TypeScript on the front, Python and FastAPI behind it, and a year spent training models to catch fraud."
    />
    <meta name="twitter:image" content="/og.png" />

    <!-- Set the theme before first paint so there is no flash of the wrong ground. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('theme');
          if (saved === 'dark' || saved === 'light') {
            document.documentElement.setAttribute('data-theme', saved);
          }
        } catch (e) {
          /* private mode — fall through to prefers-color-scheme */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
